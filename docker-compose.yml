services:
  # Serviço de Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: app_mysql
    environment:
      MYSQL_ROOT_PASSWORD: devpass
      MYSQL_DATABASE: defaultdb
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdevpass"]
      timeout: 10s
      retries: 5
      interval: 10s

  # Serviço Backend (Node.js/Express)
  back:
    build: ./backend
    container_name: app_backend
    ports:
      - "5000:5000"
    environment:
      APP_PORT: 5000
      NODE_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: devuser
      DATABASE_PASSWORD: devpass
      DATABASE_NAME: defaultdb
      JWT_SECRET: api-secti-jwt-secret-2025-dev-local
      JWT_EXPIRES_IN: 1d
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - ./backend:/usr/app
      - /usr/app/node_modules

  # Serviço Frontend (React/Vite)
  front:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: app_frontend
    ports:
      - "3000:3000"
    depends_on:
      - back
    restart: always
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api